<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>{{ product.name }} — CardFlux</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <a href="{% url 'product_list' %}" class="text-decoration-none mb-3 d-inline-flex align-items-center text-primary">
        ← Назад в каталог
    </a>
    <div class="row">
        <div class="col-lg-6">
            {% if product.image %}
            <img src="{{ product.image.url }}" class="img-fluid rounded shadow" alt="{{ product.name }}">
            {% else %}
            <div class="bg-light d-flex align-items-center justify-content-center" style="min-height: 400px;">
                <span class="text-muted">Нет изображения</span>
            </div>
            {% endif %}
        </div>
        <div class="col-lg-6">
            <h1>{{ product.name }}</h1>
            <p class="lead">{{ product.price }} ₽</p>
            <hr>
            <p>{{ product.description }}</p>
        </div>
    </div>
</div>
</body>
</html>
