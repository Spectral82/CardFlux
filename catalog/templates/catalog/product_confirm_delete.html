{% extends "catalog/base.html" %}

{% block title %}Удаление товара — CardFlux{% endblock %}

{% block content %}
<h2>Удалить товар «{{ object.name }}»?</h2>
<p class="text-muted">Действие нельзя отменить.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'product_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
