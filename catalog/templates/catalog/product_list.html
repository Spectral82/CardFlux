<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Каталог товаров — CardFlux</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4">Товары для ремонта и освещения</h1>
    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm bg-white">
                {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}" style="height: 240px; object-fit: cover;">
                {% else %}
                <div class="d-flex align-items-center justify-content-center bg-light" style="height: 240px;">
                    <span class="text-muted">Нет фото</span>
                </div>
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text text-truncate">{{ product.description|truncatechars:120 }}</p>
                    <p class="fw-bold">{{ product.price }} ₽</p>
                    <a href="{% url 'product_detail' pk=product.pk %}" class="btn btn-primary">Подробнее</a>
                </div>
            </div>
        </div>
        {% empty %}
        <p>Товаров пока нет.</p>
        {% endfor %}
    </div>
</div>
</body>
</html>
